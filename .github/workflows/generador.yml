name: Generar Wallpapers JSON Automatico

on:
  push:
    paths:
      - 'img/**'
      - '*.jpg'
      - '*.jpeg'
      - '*.png'
      - '*.webp'
      - '*.mp4'
      - '!wallpapers.json'
      - '!wallpapers_cache.json'
      - '!img/thumbs/**'
  workflow_dispatch:

# Evita que dos corridas se pisen entre sí (por ejemplo, dos pushes seguidos)
# mientras ambas intentan hacer commit y push al mismo tiempo.
concurrency:
  group: wallpapers-generator
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar FFmpeg y librerias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache de Modelo CLIP Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-clip-large-v1
          restore-keys: |
            hf-clip-large-

      - name: Instalar librerias de Python
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install Pillow opencv-python-headless transformers pyyaml requests numpy

      - name: Ejecutar script generador
        env:
          PUBLITIO_KEY: ${{ secrets.PUBLITIO_KEY }}
          PUBLITIO_SECRET: ${{ secrets.PUBLITIO_SECRET }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python generador.py

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wallpapers.json wallpapers_cache.json img/thumbs/ img/
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar"
            exit 0
          fi
          git commit -m "Actualización automática de catálogo y miniaturas HD [skip ci]"
          # Si el remoto cambió entre el checkout y este commit (otra corrida,
          # o un push manual), reintenta con rebase antes de rendirse.
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push falló, reintentando con rebase (intento $i)..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep 3
          done
          echo "No se pudo hacer push tras varios intentos" >&2
          exit 1
